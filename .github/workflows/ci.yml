name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Rule reference is generated from rules.py
        run: python scripts/gen_checks_doc.py --check
      - name: Example report is current
        run: |
          agent-config-audit examples/sample-project --format markdown --output /tmp/report.md
          diff <(grep -v '^Root:' /tmp/report.md) <(grep -v '^Root:' examples/report.md)
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          agent-config-audit --version
          agent-config-audit examples/sample-project --format sarif --output /tmp/aca.sarif
          python -c "import json; d=json.load(open('/tmp/aca.sarif')); assert d['version']=='2.1.0' and d['runs'][0]['results']"
      - name: Audit this repository's own agent configuration
        run: agent-config-audit . --exclude 'tests/**' --exclude 'examples/**' --fail-on low

  quickstart:
    name: README quick start on a fresh install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install with pipx from the checkout and compare with the README sample
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pipx
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/bin"
          python -m pipx install --quiet "$GITHUB_WORKSPACE"
          export PATH="$PIPX_BIN_DIR:$PATH"
          # The README sample ends with "  ..." after the first two fixes; compare everything before that line.
          awk '/^```text$/{f=1;next} f&&/^```$/{exit} f' README.md | sed '/^  \.\.\.$/,$d' > "$RUNNER_TEMP/want.txt"
          cp -r examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          agent-config-audit examples/sample-project > got.txt
          version=$(agent-config-audit --version | awk '{print $NF}')
          sed -i "1s/^agent-config-audit [0-9.]*:/agent-config-audit $version:/" want.txt
          diff want.txt <(head -n "$(wc -l < want.txt)" got.txt)
          set +e
          agent-config-audit examples/sample-project --fail-on high > /dev/null
          code=$?
          set -e
          test "$code" = "1"

  action:
    name: Run the action on the example
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: aca
        with:
          root: examples/sample-project
          fail-on: none
          upload: ${{ github.event_name != 'pull_request' }}
      - name: Show outputs
        run: echo "findings=${{ steps.aca.outputs.findings }} sarif=${{ steps.aca.outputs.sarif-file }}"

  container-build:
    name: Build the container image and run it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image, print --help and audit the sample project from a mount
        run: |
          docker build --build-arg VERSION=ci -t agent-config-audit:ci .
          docker run --rm agent-config-audit:ci --help > help.txt && grep "^usage: agent-config-audit" help.txt
          docker run --rm agent-config-audit:ci --version
          test "$(docker run --rm --entrypoint id agent-config-audit:ci -u)" = "1000"
          docker run --rm -v "$PWD/examples/sample-project:/work:ro" agent-config-audit:ci --format markdown > report.md
          diff <(grep -v '^Root:' report.md) <(grep -v '^Root:' examples/report.md)
          set +e
          docker run --rm -v "$PWD/examples/sample-project:/work:ro" agent-config-audit:ci --fail-on high > /dev/null
          test $? -eq 1
